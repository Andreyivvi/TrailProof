[project]
name = "trailproof"
version = "0.1.0"
description = "TrailProof MVP: an append-only commitment ledger for AI-agent purchases, exposed as an MCP server."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "cryptography>=42",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trailproof", "wallet", "demo_shop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
